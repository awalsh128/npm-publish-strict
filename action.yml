name: "NPM Publish Strict"
description: >-
  Opinionated release pipeline: semantic-release (Conventional Commits), typedoc API docs, and npm publishing
  via trusted publishing (OIDC). Fails fast, with fix steps, when the repository breaks the conventions.
author: Andrew Walsh
branding:
  icon: package
  color: green

inputs:
  mode:
    description: >-
      'release' checks preconditions, then releases. 'check' only checks preconditions (including the npm
      trusted publisher), so you can confirm a fix without releasing anything.
    required: false
    default: "release"
  baseline-commit:
    description: >-
      Commit (SHA) from which Conventional Commits are enforced and releases are analyzed. Earlier history is
      ignored. Leave empty to enforce the whole history.
    required: false
    default: ""
  bump:
    description: >-
      The smallest version bump to release: 'auto' (from the commits only), 'patch', 'minor' or 'major'.
      Commits can still ask for a bigger one, and a release happens even when no commit calls for one. On the
      candidate branch it sets the candidate's version (a forced 'major' from 1.4.0 gives 2.0.0-rc.1).
    required: false
    default: "auto"
  dry-run:
    description: >-
      'true' runs a release without tagging or publishing anything: the checks run, and semantic-release logs
      the version and release notes it would produce. Has no effect in 'check' mode.
    required: false
    default: "false"
  github-token:
    description: "Token for the GitHub API (releases, issue comments) and for pushing the release tag."
    required: false
    default: ${{ github.token }}

outputs:
  failed-checks:
    description: "Comma-separated ids of the preconditions that failed; empty when all pass."
  released:
    description: "'true' when a release was cut; empty when nothing was released."
  version:
    description: "Released version; empty when nothing was released."
  tag:
    description: "Git tag of the release (v<version>); empty when nothing was released."
  package-name:
    description: "Name of the released package from its package.json; empty when nothing was released."
  prerelease:
    description:
      "'true' for a release candidate, 'false' for an official release; empty when nothing was released."
  release-type:
    description: "Version bump semantic-release chose (major, minor, patch); empty when nothing was released."
  git-head:
    description: "Commit SHA the release was cut from; empty when nothing was released."
  published:
    description:
      "'true' when the package was published to npm; 'false' for candidates; empty when nothing was released."
  npm-url:
    description: "URL of the published package version on npm; empty unless published."
  release-url:
    description: "URL of the GitHub Release; empty when nothing was released."
  release-notes:
    description: "Markdown release notes of the release; empty when nothing was released."

runs:
  using: node24
  main: dist/main.js
