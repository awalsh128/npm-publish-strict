name: "NPM Publish Strict"
description: >-
  Opinionated release pipeline: semantic-release (Conventional Commits), typedoc API docs, and npm
  publishing via trusted publishing (OIDC). Fails fast, with fix steps, when the repository breaks
  the conventions.
author: Andrew Walsh
branding:
  icon: package
  color: green

inputs:
  mode:
    description: >-
      'release' checks preconditions, then releases. 'check' only checks preconditions (including
      the npm trusted publisher), so you can confirm a fix without releasing anything.
    required: false
    default: "release"
  dry-run:
    description: "Run the release without tagging, publishing, or creating a GitHub Release."
    required: false
    default: "false"
  baseline-commit:
    description: >-
      Commit (SHA) from which Conventional Commits are enforced and releases are analyzed. Earlier
      history is ignored. Leave empty to enforce the whole history.
    required: false
    default: ""
  working-directory:
    description: "Directory of the package to release, relative to the workspace."
    required: false
    default: "."
  docs-script:
    description: "npm script that builds the API docs (typedoc). Must exist in the consumer package.json."
    required: false
    default: "docs:api"
  docs-dir:
    description: "Directory the docs script writes to; exposed through the docs-dir output when a release happens."
    required: false
    default: "docs/api"
  release-branch:
    description: "Branch that publishes to npm and cuts official releases."
    required: false
    default: "main"
  candidate-branch:
    description: "Branch that cuts release candidates (-rc.N) with a tag and GitHub prerelease only."
    required: false
    default: "staging"
  git-credentials:
    description: >-
      Optional 'user:token' used to push the release tag, e.g. a GitHub App token when the default
      token is restricted from creating tags. Defaults to the github-token.
    required: false
    default: ""
  github-token:
    description: "Token for the GitHub API (releases, issue comments)."
    required: false
    default: ${{ github.token }}

outputs:
  failed-checks:
    description: "Comma-separated ids of the preconditions that failed; empty when all pass."
  version:
    description: "Released version; empty when nothing was released."
  docs-dir:
    description: "Directory holding the built API docs; empty when nothing was released."

runs:
  using: node24
  main: dist/main.js
