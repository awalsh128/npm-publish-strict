name: "NPM Publish Strict"
description: >-
  Opinionated release pipeline: semantic-release (Conventional Commits), typedoc API docs, and npm
  publishing via trusted publishing (OIDC). Fails fast when the repository breaks the conventions.
author: Andrew Walsh
branding:
  icon: package
  color: green

inputs:
  dry-run:
    description: "Run the release without tagging, publishing, or creating a GitHub Release."
    required: false
    default: "false"
  node-version:
    description: "Node.js version used for the release."
    required: false
    default: "24"
  docs-script:
    description: "npm script that builds the API docs (typedoc). Must exist in the consumer package.json."
    required: false
    default: "docs:api"
  docs-dir:
    description: "Directory the docs script writes to; exposed through the docs-dir output when a release happens."
    required: false
    default: "docs/api"
  release-branch:
    description: "Branch that publishes to npm and cuts official releases."
    required: false
    default: "main"
  candidate-branch:
    description: "Branch that cuts release candidates (-rc.N) with a tag and GitHub prerelease only."
    required: false
    default: "staging"
  git-credentials:
    description: >-
      Optional 'user:token' used to push the release tag, e.g. a GitHub App token when the default
      token is restricted from creating tags. Defaults to the github-token.
    required: false
    default: ""
  github-token:
    description: "Token for the GitHub API (releases, issue comments)."
    required: false
    default: ${{ github.token }}

outputs:
  version:
    description: "Released version; empty when nothing was released."
    value: ${{ steps.release.outputs.version }}
  docs-dir:
    description: "Directory holding the built API docs; empty when nothing was released."
    value: ${{ steps.release.outputs.docs-dir }}

runs:
  using: composite
  steps:
    - name: Validate repository
      shell: bash
      env:
        DOCS_SCRIPT: ${{ inputs.docs-script }}
        RELEASE_BRANCH: ${{ inputs.release-branch }}
        CANDIDATE_BRANCH: ${{ inputs.candidate-branch }}
      run: bash "$GITHUB_ACTION_PATH/scripts/dist/validate.sh"

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    # Scripts stay off: this job can mint npm (OIDC) and GitHub credentials, so dependency install
    # scripts must not run with them.
    - name: Install consumer dependencies
      shell: bash
      run: npm ci --ignore-scripts

    - name: Install release tooling
      shell: bash
      run: npm ci --ignore-scripts --prefix "$GITHUB_ACTION_PATH"

    - name: Release
      id: release
      shell: bash
      env:
        DRY_RUN: ${{ inputs.dry-run }}
        DOCS_SCRIPT: ${{ inputs.docs-script }}
        DOCS_DIR: ${{ inputs.docs-dir }}
        RELEASE_BRANCH: ${{ inputs.release-branch }}
        CANDIDATE_BRANCH: ${{ inputs.candidate-branch }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GIT_CREDENTIALS: ${{ inputs.git-credentials != '' && inputs.git-credentials || format('x-access-token:{0}', inputs.github-token) }}
      run: bash "$GITHUB_ACTION_PATH/scripts/dist/release.sh"
