version: 2
updates:
  # Dependency updates land on staging, never directly on main.
  - package-ecosystem: npm
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Version 10 needs conventional-changelog-writer 9, but @semantic-release/release-notes-generator
      # still loads writer 8, so release notes fail to render. Lift this when it supports writer 9.
      - dependency-name: conventional-changelog-conventionalcommits
        update-types: ["version-update:semver-major"]
  # typedoc and the TypeScript 6 it needs, apart from the root lockfile (see its package.json).
  - package-ecosystem: npm
    directory: /scripts/ops/typedoc
    target-branch: staging
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # typedoc 0.28 supports TypeScript up to 6.0.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
