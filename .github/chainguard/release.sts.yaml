# yaml-language-server: $schema=https://raw.githubusercontent.com/octo-sts/app/refs/heads/main/pkg/octosts/octosts.TrustPolicy.json

# Tokens for release.yml to push release tags, which the tag ruleset only lets the Octo STS app do.
# Octo STS reads this file from the default branch (main), and only the release workflow running on
# main or staging matches. The subject carries the owner and repository IDs.
issuer: https://token.actions.githubusercontent.com
subject_pattern: "repo:awalsh128@2087466/npm-publish-strict@1459294093:.*"
claim_pattern:
  ref: "refs/heads/(main|staging)"
  job_workflow_ref: "awalsh128/npm-publish-strict/\\.github/workflows/release\\.yml@refs/heads/(main|staging)"

permissions:
  contents: write
