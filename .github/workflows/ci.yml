name: CI

on:
  pull_request:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR supersedes its running checks. Other runs (staging pushes release) get their own
# group, so none is cancelled or dropped from the queue.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        shell: bash
        run: npm ci --ignore-scripts

      - name: Check formatting
        shell: bash
        run: npm run format:check

      # npm test builds first, and the build typechecks.
      - name: Test
        shell: bash
        run: npm test

      # The action runs from the committed dist/, so it must match the sources. npm test just rebuilt it,
      # so only the diff is left to check (npm run check:dist rebuilds first, for local use).
      - name: Check dist/ is up to date
        shell: bash
        run: git diff --exit-code -- dist

      # Consumer releases install this action with --omit=dev --omit=optional (see src/release.ts) and
      # then load release.config.mjs, so every package it imports must be a runtime dependency. Same
      # files as the release bundle.
      - name: Load release.config.mjs from a runtime-only install
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/runtime-install"
          mkdir -p "$dir"
          git archive HEAD action.yml dist data release.config.mjs package.json package-lock.json | tar -x -C "$dir"
          npm ci --ignore-scripts --omit=dev --omit=optional --no-audit --no-fund --prefix "$dir"
          node --input-type=module -e 'await import(process.argv[1]); console.log("release.config.mjs loads")' "$dir/release.config.mjs"

      # Releases build the API docs before tagging (release.config.mjs), so a broken docs:api fails here first.
      - name: Build API docs
        shell: bash
        run: |
          npm ci --ignore-scripts --prefix scripts/ops/typedoc
          npm run docs:api

  # Runs this checkout of the action inside a real workflow, against fixture repos built by
  # test/make-fixture.ts. The action runs from the repository root, so each fixture is moved into the
  # workspace and the action is checked out beside it. Check mode never releases, so no npm, OIDC or
  # tag access is needed.
  action-e2e-case:
    name: action-e2e (${{ matrix.name }})
    runs-on: ubuntu-24.04
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: healthy repository passes
            scenario: healthy
            use-baseline: false
            failed-checks: ""
          - name: legacy commits fail without a baseline
            scenario: legacy-commits
            use-baseline: false
            failed-checks: commit-messages
          - name: legacy commits pass with a baseline
            scenario: legacy-commits
            use-baseline: true
            failed-checks: ""
    steps:
      - name: Checkout action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .action-under-test
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Build fixture in the workspace
        id: fixture
        shell: bash
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/fixture"
          baseline="$(node .action-under-test/test/make-fixture.ts "$fixture" "$SCENARIO" "$GITHUB_REPOSITORY" main)"
          shopt -s dotglob
          mv "$fixture"/* "$GITHUB_WORKSPACE"/
          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"

      - name: Run the action in check mode
        id: action
        continue-on-error: true
        uses: ./.action-under-test
        with:
          mode: check
          baseline-commit: ${{ matrix.use-baseline && steps.fixture.outputs.baseline || '' }}

      - name: Assert the outcome and failed checks
        shell: bash
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FAILED: ${{ steps.action.outputs.failed-checks }}
          EXPECTED: ${{ matrix.failed-checks }}
        run: |
          set -euo pipefail
          expected_outcome="$([[ -n "$EXPECTED" ]] && echo failure || echo success)"
          [[ "$OUTCOME" == "$expected_outcome" ]] || { echo "::error::expected outcome $expected_outcome, got $OUTCOME"; exit 1; }
          [[ "$FAILED" == "$EXPECTED" ]] || { echo "::error::expected failed-checks='$EXPECTED', got '$FAILED'"; exit 1; }

  # The single required status check for the matrix above (rulesets match check names exactly).
  # Passes only when every case passed (a skipped case means build-and-test failed).
  action-e2e:
    if: ${{ always() }}
    needs: action-e2e-case
    runs-on: ubuntu-24.04
    steps:
      - name: Require every case to pass
        shell: bash
        env:
          RESULT: ${{ needs.action-e2e-case.result }}
        run: |
          [[ "$RESULT" == "success" ]] || { echo "::error::action-e2e cases: $RESULT"; exit 1; }

  # Release candidates are only cut from staging commits that pass every CI job.
  release-candidate:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/staging' }}
    needs: [build-and-test, action-e2e]
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/release.yml
