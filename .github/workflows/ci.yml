name: CI

on:
  pull_request:
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        shell: bash
        run: npm ci --ignore-scripts

      # npm test builds first, and the build typechecks.
      - name: Test
        shell: bash
        run: npm test

      # The action runs from the committed dist/, so it must match the sources.
      - name: Check dist/ is up to date
        shell: bash
        run: npm run check:dist

  # Runs this checkout of the action inside a real workflow, against fixture repos built by
  # test/make-fixture.ts. The action runs from the repository root, so each fixture is moved into the
  # workspace and the action is checked out beside it. Check mode never releases, so no npm, OIDC or
  # tag access is needed. Skipped on main, where check mode also verifies the npm trusted publisher.
  action-e2e-case:
    if: ${{ github.ref != 'refs/heads/main' }}
    name: action-e2e (${{ matrix.name }})
    runs-on: ubuntu-24.04
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: healthy repository passes
            scenario: healthy
            use-baseline: false
            failed-checks: ""
          - name: legacy commits fail without a baseline
            scenario: legacy-commits
            use-baseline: false
            failed-checks: commit-messages
          - name: legacy commits pass with a baseline
            scenario: legacy-commits
            use-baseline: true
            failed-checks: ""
    steps:
      - name: Checkout action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .action-under-test
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Build fixture in the workspace
        id: fixture
        shell: bash
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/fixture"
          baseline="$(node .action-under-test/test/make-fixture.ts "$fixture" "$SCENARIO" "$GITHUB_REPOSITORY" main)"
          shopt -s dotglob
          mv "$fixture"/* "$GITHUB_WORKSPACE"/
          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"

      - name: Run the action in check mode
        id: action
        continue-on-error: true
        uses: ./.action-under-test
        with:
          mode: check
          baseline-commit: ${{ matrix.use-baseline && steps.fixture.outputs.baseline || '' }}

      - name: Assert the outcome and failed checks
        shell: bash
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FAILED: ${{ steps.action.outputs.failed-checks }}
          EXPECTED: ${{ matrix.failed-checks }}
        run: |
          set -euo pipefail
          expected_outcome="$([[ -n "$EXPECTED" ]] && echo failure || echo success)"
          [[ "$OUTCOME" == "$expected_outcome" ]] || { echo "::error::expected outcome $expected_outcome, got $OUTCOME"; exit 1; }
          [[ "$FAILED" == "$EXPECTED" ]] || { echo "::error::expected failed-checks='$EXPECTED', got '$FAILED'"; exit 1; }

  # The single required status check for the matrix above (rulesets match check names exactly).
  # Passes when every case passed, or when the matrix was skipped on main.
  action-e2e:
    if: ${{ always() }}
    needs: action-e2e-case
    runs-on: ubuntu-24.04
    steps:
      - name: Require every case to pass
        shell: bash
        env:
          RESULT: ${{ needs.action-e2e-case.result }}
        run: |
          [[ "$RESULT" == "success" || "$RESULT" == "skipped" ]] || { echo "::error::action-e2e cases: $RESULT"; exit 1; }

  commitlint:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        shell: bash
        run: npm ci --ignore-scripts

      - name: Lint commits
        shell: bash
        run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}"

  # Release candidates are only cut from staging commits that pass every CI job.
  release-candidate:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/staging' }}
    needs: [build-and-test, action-e2e]
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/release.yml
