name: Release

# Releases are always gated by CI:
# - staging: ci.yml calls this after its jobs pass, releasing a candidate (e.g. 1.2.0-rc.1).
# - main: promote.yml starts this after fast-forwarding main to a CI-passed staging commit,
#   releasing an official version (e.g. 1.2.0).
# - Manual runs first require a successful CI run for the commit.
#
# No stored secrets: the tag token comes from Octo STS under .github/chainguard/release.sts.yaml,
# which only this workflow on main or staging matches. The 'release' environment (main and staging)
# still scopes the job. The app pushes tags because the ruleset blocks every other tag creation.
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run the release without tagging or publishing anything"
        type: boolean
        required: false
        default: false

permissions: {}

jobs:
  release:
    # Releases are off unless the repository variable RELEASES_ENABLED is 'true' (Settings > Secrets and
    # variables > Actions > Variables). Every route to a release goes through this job: a staging push,
    # promote, and a manual run. A dry run tags and publishes nothing, so it is always allowed.
    if: ${{ vars.RELEASES_ENABLED == 'true' || inputs.dry-run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      actions: read # Read CI results on manual runs
      contents: write # Release assets
      id-token: write # Sigstore signing for the attestation, and the Octo STS token
      attestations: write # Store the attestation
      issues: write # semantic-release comments
      pull-requests: write # semantic-release comments
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # semantic-release needs the whole history
          persist-credentials: false

      - name: Require CI success
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: ./.github/actions/require-ci-success
        with:
          sha: ${{ github.sha }}
          token: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # Install scripts stay off: this job can mint GitHub tokens.
      # All dependencies: typedoc typechecks the sources, so it needs the devDependencies' types
      # (@types/node, @octokit/rest, vitest). typedoc has its own lockfile (scripts/ops/typedoc)
      # because it doesn't support TypeScript 7 yet.
      - name: Install dependencies
        shell: bash
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix scripts/ops/typedoc

      # GitHub rejects tag creation by GITHUB_TOKEN here (the tag ruleset), so the tag is pushed
      # with an Octo STS token, which promote.yml also uses (with its own policy) to update main.
      - name: Create tag token
        id: octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: ${{ github.repository }}
          identity: release

      - name: Publish with semantic-release
        shell: bash
        env:
          GIT_CREDENTIALS: x-access-token:${{ steps.octo-sts.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry-run && '--dry-run' || '' }}
        run: npx semantic-release $DRY_RUN

      # A release tags HEAD, so a tag on HEAD means this run released. Bundle exactly what consumers
      # run (the action manifest, compiled dist/, and the release config and lockfile it installs
      # from) from the tagged commit, so the attestation covers the released bytes.
      - name: Bundle release
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          tag="$(git tag --points-at HEAD | grep -E '^v[0-9]' | head -n1 || true)"
          if [[ -z "$tag" ]]; then
            echo "No release in this run; nothing to attest."
            exit 0
          fi
          bundle="npm-publish-strict-$tag.tar.gz"
          git archive --format=tar.gz -o "$bundle" "$tag" \
            action.yml dist data release.config.mjs package.json package-lock.json LICENSE
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "path=$bundle" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        if: ${{ steps.bundle.outputs.path != '' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.bundle.outputs.path }}

      - name: Attach bundle to the release
        if: ${{ steps.bundle.outputs.path != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.bundle.outputs.tag }}
          BUNDLE: ${{ steps.bundle.outputs.path }}
        run: gh release upload "$TAG" "$BUNDLE" --clobber
