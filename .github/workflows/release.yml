name: Release

# Tags and GitHub Releases are the action's version history; consumers pin to a tag or SHA.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write # tags, GitHub Releases, release assets
      id-token: write # Sigstore signing for the attestation
      attestations: write # store the attestation
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        shell: bash
        run: npm ci --ignore-scripts

      - name: Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx semantic-release --branches main --plugins @semantic-release/commit-analyzer @semantic-release/release-notes-generator @semantic-release/github

      # A release tags HEAD, so a tag on HEAD means this run released. Bundle exactly what consumers
      # run (the action manifest, compiled dist/, and the release config and lockfile it installs
      # from) from the tagged commit, so the attestation covers the released bytes.
      - name: Bundle release
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          tag="$(git tag --points-at HEAD | grep -E '^v[0-9]' | head -n1 || true)"
          if [[ -z "$tag" ]]; then
            echo "No release in this run; nothing to attest."
            exit 0
          fi
          bundle="npm-publish-strict-action-$tag.tar.gz"
          git archive --format=tar.gz -o "$bundle" "$tag" \
            action.yml dist release.config.mjs package.json package-lock.json LICENSE
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "path=$bundle" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        if: ${{ steps.bundle.outputs.path != '' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.bundle.outputs.path }}

      - name: Attach bundle to the release
        if: ${{ steps.bundle.outputs.path != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.bundle.outputs.tag }}
          BUNDLE: ${{ steps.bundle.outputs.path }}
        run: gh release upload "$TAG" "$BUNDLE" --clobber
