name: CodeQL

# Scans the TypeScript sources and the workflows themselves. Findings land in the Security tab.
on:
  pull_request:
  push:
    branches: [main, staging]
  schedule:
    - cron: "30 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR supersedes its running scan. Other runs get their own group, so none is cancelled.
concurrency:
  group: codeql-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    # Fork PRs can't upload security events.
    if:
      ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name ==
      github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read # For the workflow run context CodeQL reports with
      contents: read
      security-events: write # For uploading the results
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: +security-and-quality

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
